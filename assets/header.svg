<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" width="900" height="372" role="img" aria-label="Saif Al Saad — Software Quality Assurance and Testing">
<title>Saif Al Saad — Software Quality Assurance &amp; Testing</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#101a33"/></linearGradient>
<linearGradient id="name" x1="0" x2="1"><stop offset="0" stop-color="#38bdf8"/><stop offset="0.55" stop-color="#2ee59d"/><stop offset="1" stop-color="#ffc857"/></linearGradient>
<radialGradient id="halo" cx="0.85" cy="0.1" r="0.6"><stop offset="0" stop-color="#38bdf8" stop-opacity=".22"/><stop offset="1" stop-color="#38bdf8" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
</defs>
<style>text{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:14px}.fg{fill:#e6edf7}.dim{fill:#7d8aa5}.ok{fill:#2ee59d;font-weight:700}.run{fill:#ffc857;font-weight:700}.prompt{fill:#38bdf8}.cmd{fill:#e6edf7}.blink{animation:b 1s steps(1) infinite}@keyframes b{50%{opacity:0}}.spin{transform-origin:0 0;animation:sp 1.2s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}.glow{animation:gl 3s ease-in-out infinite}@keyframes gl{50%{opacity:.55}}@keyframes kcmd{0%,1.67%{opacity:0}2.47%,95%{opacity:1}100%{opacity:0}}@keyframes k0{0%,5.56%{opacity:0}6.36%,95%{opacity:1}100%{opacity:0}}@keyframes k1{0%,12.22%{opacity:0}13.02%,95%{opacity:1}100%{opacity:0}}@keyframes k2{0%,18.89%{opacity:0}19.69%,95%{opacity:1}100%{opacity:0}}@keyframes k3{0%,25.56%{opacity:0}26.36%,95%{opacity:1}100%{opacity:0}}@keyframes ksum{0%,34.44%{opacity:0}35.24%,95%{opacity:1}100%{opacity:0}}</style>
<rect width="900" height="372" rx="16" fill="url(#bg)"/>
<rect width="900" height="372" rx="16" fill="url(#grid)"/>
<rect class="glow" width="900" height="372" rx="16" fill="url(#halo)"/>
<rect x=".5" y=".5" width="899" height="371" rx="16" fill="none" stroke="#26314d"/>
<circle cx="28" cy="24" r="6" fill="#ff5f57"/><circle cx="48" cy="24" r="6" fill="#febc2e"/><circle cx="68" cy="24" r="6" fill="#28c840"/>
<text x="450" y="29" text-anchor="middle" class="dim" style="font-size:12px">saif@diu ~/profile — quality-first</text>
<line x1="0" x2="900" y1="46" y2="46" stroke="#26314d"/>
<text x="36" y="104" style="font-size:46px;font-weight:800;letter-spacing:1px" fill="url(#name)">SAIF AL SAAD</text>
<text x="38" y="130" class="dim" style="font-size:15px;letter-spacing:.5px">I break software on purpose, so users never have to.</text>
<text x="36" y="160" class="prompt" style="animation:kcmd 18s infinite;opacity:0">$ <tspan class="cmd">npm test -- saif.spec</tspan></text><text x="36" y="196" xml:space="preserve" style="animation:k0 18s infinite;opacity:0"><tspan class="ok">PASS</tspan><tspan class="dim">  identity     </tspan><tspan class="fg">BSc Software Engineering · Daffodil International University</tspan></text><text x="36" y="222" xml:space="preserve" style="animation:k1 18s infinite;opacity:0"><tspan class="ok">PASS</tspan><tspan class="dim">  major        </tspan><tspan class="fg">Software Quality Assurance &amp; Testing</tspan></text><text x="36" y="248" xml:space="preserve" style="animation:k2 18s infinite;opacity:0"><tspan class="ok">PASS</tspan><tspan class="dim">  builds       </tspan><tspan class="fg">full-stack apps · 3D room planner · AI-assisted finance tracker</tspan></text><text x="36" y="274" xml:space="preserve" style="animation:k3 18s infinite;opacity:0"><tspan class="run">RUN </tspan><tspan class="dim">  automation   </tspan><tspan class="fg">Playwright · Page Object Model · CI/CD</tspan></text><g style="animation:ksum 18s infinite;opacity:0"><line x1="36" x2="864" y1="292" y2="292" stroke="#26314d" stroke-dasharray="3 5"/><text x="36" y="316" xml:space="preserve"><tspan class="dim">Tests:  </tspan><tspan class="ok">3 passed</tspan><tspan class="dim">, </tspan><tspan class="run">1 running</tspan><tspan class="dim">   ·   Status: </tspan><tspan class="ok">open to QA internships &amp; junior roles</tspan></text><rect class="blink" x="36" y="326" width="9" height="16" fill="#38bdf8"/></g>
</svg>