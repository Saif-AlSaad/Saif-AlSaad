<style>text{font-family:'JetBrains Mono','SFMono-Regular',Menlo,Consolas,'Liberation Mono',monospace;font-size:14px}.pulse{animation:p 2s ease-out infinite;transform-origin:44px 45px}@keyframes p{0%{opacity:.7;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
